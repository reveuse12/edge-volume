name: Windows development build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.cargo/**'
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'tools/windows-probe.cpp'
      - 'package*.json'
      - '.github/workflows/windows-development.yml'
  pull_request:
    paths:
      - '.cargo/**'
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'tools/windows-probe.cpp'
      - 'package*.json'
      - '.github/workflows/windows-development.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci
      - name: Test shared gesture engine and compile Windows native adapter
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build read-only probe
        shell: cmd
        run: |
          mkdir windows-artifacts
          cl /nologo /EHsc /MT /std:c++17 /W4 tools\windows-probe.cpp src-tauri\native\windows.cpp /Fe:windows-artifacts\edgevolume-windows-probe.exe /link ole32.lib user32.lib
          if errorlevel 1 exit /b 1
          windows-artifacts\edgevolume-windows-probe.exe --self-test
      - name: Build experimental installer
        run: npm run tauri build -- --bundles nsis
      - name: Verify standalone runtime dependencies
        shell: pwsh
        run: |
          $binaries = @('src-tauri/target/release/edgevolume.exe', 'windows-artifacts/edgevolume-windows-probe.exe')
          foreach ($binary in $binaries) {
            $dependencies = (& dumpbin /dependents $binary | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Dependency inspection failed: $binary" }
            Write-Output $dependencies
            if ($dependencies -match '(?i)(MSVCP|VCRUNTIME|CONCRT)[0-9_]*[^\s]*\.dll') {
              throw "Unexpected external MSVC runtime dependency: $binary"
            }
          }
      - name: Collect development installer
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe windows-artifacts/
          Copy-Item docs/windows-development.md windows-artifacts/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeVolume-windows-development-x64
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 14
